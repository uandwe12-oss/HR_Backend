name: Build and deploy Node.js app to Azure Web App - myuandwe

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Verify dependencies
        run: |
          node -e "require('dotenv'); console.log('dotenv installed successfully')"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0F19435592EF4101AA05ED86F637D60A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_055E8A391162409BAB432D57F6EDB4CB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F539FBD094224A6DB53D387CCCB64655 }}

      - name: Disable Azure remote build
        run: |
          az webapp config appsettings set \
            --name myuandwe \
            --resource-group $(az webapp show --name myuandwe --query resourceGroup -o tsv) \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'myuandwe'
          slot-name: 'Production'
          package: '.'
